; CryEngine Resource Compiler Configuration

imagecompressor=CryImage

brdfGlossScale=16
brdfGlossBias=0
cm_edgefixup=16

; Asset browser predefined types
assettypes=cgf,Mesh;chr,Skeleton;skin,SkinnedMesh;dds,Texture;mtl,Material;cga,AnimatedMesh;anm,MeshAnimation;cdf,Character;caf,Animation;wav,Sound;ogg,Sound;cax,GeometryCache;lua,Script;pfx,Particles;xml,Xml;level,Level

[_platform]
name=pc,tegra
bigendian=0
pointersize=8

[_platform]
name=ps4,orbis
bigendian=0
pointersize=8

[_platform]
name=xboxone,durango,xb1
bigendian=0
pointersize=8

[_platform]
name=gles3,es3,android
bigendian=0
pointersize=4

; Legacy preset aliases
[_presetAliases]
Diffuse_highQ=Albedo
Diffuse_lowQ=Albedo
DiffuseWithMask_highQ=AlbedoWithOpacity
DiffuseWithMask_lowQ=AlbedoWithOpacity
DiffuseWithAlphaTest_highQ=AlbedoWithCoverage
DiffuseWithAlpha_highQ=AlbedoWithGenericAlpha
Diffuse_Decal=Decal_AlbedoWithOpacity
Specular_highQ=Reflectance
Specular_lowQ=Reflectance
SpecularLinear_highQ=Reflectance_Linear
SpecularWithGlossInAlpha_highQ=ReflectanceWithSmoothness_Legacy
Packed_specular_lowq=Reflectance
Normalmap_highQ=Normals
Normalmap_lowQ=Normals
NormalmapWithGlossInAlpha_highQ=NormalsWithSmoothness_Legacy
DisplacementMap=Displacement
Bump2Normalmap_highQ=NormalsFromDisplacement
Bump2Normalmap_lowQ=NormalsFromDisplacement
DetailBumpMap=Normals
DetailTexture=Albedo
MergedDetailMap=Detail_MergedAlbedoNormalsSmoothness
MergedDetailMap_HighQ=Detail_MergedAlbedoNormalsSmoothness_Lossless
Skybox_highQ=SkyboxLDR
HDRCubemap_highQ=EnvironmentProbeHDR
HDRDiffuseCubemap_highQ=EnvironmentProbeHDR_Irradiance
HDRReflectionsRGBK_highQ=SkyboxHDR
HDRSkydomeRGBK_highQ=SkyboxHDR
HDRCubemapRGBK_highQ=EnvironmentProbeHDR
HDRDiffuseCubemapRGBK_highQ=EnvironmentProbeHDR_Irradiance
ParticleDiffuse=Albedo
ParticleDiffuseStreamable=Albedo
OpacityMap=Opacity
UserInterface=UserInterface_Lossless
ReferenceImage_NoSrgb=ReferenceImage_Linear
TerrainDiffuse=Terrain_Albedo
TerrainDiffuseHighPassed=Terrain_Albedo
Terrain_Albedo_HighPassed=Terrain_Albedo

;;; ============================================================================
;;; Color & Diffuse Information
;;; ============================================================================

; Diffuse color textures without alpha channel (Opaque)
[Albedo]
pixelformat=BC1
pixelformat:es3=ETC2
rgbweights=ciexyz
powof2=1
mipmaps=1
colorspace=sRGB,auto
rdo_lambda=1.5
filemasks=*_diff*

; Diffuse color textures with smooth alpha blend (BC7)
[AlbedoWithOpacity]
pixelformat=BC7t
pixelformat:es3=ETC2A
rgbweights=ciexyz
powof2=1
mipmaps=1
colorspace=sRGB,auto
rdo_lambda=1.0
filemasks=*_diff*

; Foliage / Vegetation cutout textures (AlphaTest coverage preserved on mips)
[AlbedoWithCoverage]
pixelformat=BC1a
pixelformat:es3=ETC2A
rgbweights=ciexyz
powof2=1
mipmaps=1
colorspace=sRGB,auto
alphacoverage=1
rdo_lambda=1.0
filemasks=*_diff*

[AlbedoWithGenericAlpha]
pixelformat=BC3
pixelformat:es3=ETC2A
rgbweights=ciexyz
powof2=1
mipmaps=1
colorspace=sRGB,auto
rdo_lambda=1.5
filemasks=*_diff*

[AlbedoWithGenericAlphaNoMip]
pixelformat=BC3
pixelformat:es3=ETC2A
rgbweights=ciexyz
powof2=1
mipmaps=0
colorspace=sRGB,auto
filemasks=*_diff*

;;; ============================================================================
;;; Specular & Reflectance
;;; ============================================================================

[Reflectance]
pixelformat=BC1
pixelformat:es3=ETC2
powof2=1
mipmaps=1
colorspace=sRGB,auto
rdo_lambda=1.5
filemasks=*_spec*,*_refl*

[Reflectance_Linear]
pixelformat=BC1
pixelformat:es3=ETC2
powof2=1
mipmaps=1
colorspace=sRGB,linear
rdo_lambda=1.5
filemasks=*_spec*,*_refl*

[ReflectanceWithSmoothness_Legacy]
pixelformat=BC7
pixelformat:es3=ETC2A
powof2=1
mipmaps=1
colorspace=sRGB,auto
rdo_lambda=1.0
filemasks=*_spec*

;;; ============================================================================
;;; Normals & Smoothness (RDO disabled to prevent vector artifacts)
;;; ============================================================================

; Signed BC5 normal map textures (Red = X, Green = Y)
[Normals]
pixelformat=BC5s
pixelformat:es3=EAC_RG11
powof2=1
mipnormalize=1
mipmaps=1
colorspace=linear,linear
discardalpha=1
rdo_lambda=0.0
filemasks=*_ddn*

; Signed BC5 normal map with Toksvig smoothness in attached BC4 alpha
[NormalsWithSmoothness]
pixelformat=BC5s
pixelformat:es3=EAC_RG11
pixelformatalpha=BC4
pixelformatalpha:es3=EAC_R11
powof2=1
mipnormalize=1
mipmaps=1
colorspace=linear,linear
glossfromnormals=1
rdo_lambda=0.0
filemasks=*_ddna*

[NormalsWithSmoothness_Legacy]
pixelformat=BC5s
pixelformat:es3=EAC_RG11
pixelformatalpha=BC4
pixelformatalpha:es3=EAC_R11
powof2=1
mipnormalize=1
mipmaps=1
colorspace=linear,linear
glosslegacydist=1
glossfromnormals=1
rdo_lambda=0.0
filemasks=*_ddna*

; Heightmap converted to 3D normals (BC5s)
[NormalsFromDisplacement]
pixelformat=BC5s
pixelformat:es3=EAC_RG11
bumptype=1
powof2=1
mipnormalize=1
mipmaps=1
colorspace=linear,linear
rdo_lambda=0.0
filemasks=*_bump*

;;; ============================================================================
;;; Height & Displacement Maps
;;; ============================================================================

[Displacement]
pixelformat=BC4
pixelformat:es3=EAC_R11
powof2=1
mipmaps=1
swizzle=aaa1
colorspace=linear,linear
rdo_lambda=0.0
filemasks=*_displ*

;;; ============================================================================
;;; Terrain
;;; ============================================================================

[Terrain_Albedo]
pixelformat=BC1
pixelformat:es3=ETC2
powof2=1
mipmaps=1
colorspace=linear,linear
rdo_lambda=1.5

;;; ============================================================================
;;; Decal Maps
;;; ============================================================================

[Decal_AlbedoWithOpacity]
pixelformat=BC7t
pixelformat:es3=ETC2A
powof2=1
mipmaps=1
colorspace=sRGB,auto
filemasks=*_decal*
decal=1

;;; ============================================================================
;;; Detail Maps
;;; ============================================================================

[Detail_MergedAlbedoNormalsSmoothness]
pixelformat=BC7
pixelformat:es3=ETC2A
powof2=1
mipmaps=1
colorspace=linear,linear
rdo_lambda=0.0
filemasks=*_detail*

[Detail_MergedAlbedoNormalsSmoothness_Lossless]
pixelformat=A8R8G8B8
powof2=1
mipmaps=1
colorspace=linear,linear
rdo_lambda=0.0
filemasks=*_detail*

;;; ============================================================================
;;; Skybox & HDR Cubemaps (BC6H Float16)
;;; ============================================================================

; HDR reflection probe (256x256 BC6UH GGX Importance Sampling)
[EnvironmentProbeHDR]
maxtexturesize=256
mintexturesize=256
pixelformat=BC6UH
pixelformat:es3=R9G9B9E5
discardalpha=1
cm=1
cm_ftype=ggx
cm_edgefixup=16
cm_diff=1
cm_diffpreset=EnvironmentProbeHDR_Irradiance
powof2=1
mipmaps=1
quality=slow
colorspace=linear,linear
rdo_lambda=0.0
filemasks=*_cm*,*_cubemap*

; HDR diffuse irradiance probe (32x32 BC6UH Cosine Convolution)
[EnvironmentProbeHDR_Irradiance]
maxtexturesize=32
mintexturesize=32
pixelformat=BC6UH
pixelformat:es3=R9G9B9E5
discardalpha=1
cm=1
cm_ftype=cosine
cm_edgefixup=16
powof2=1
mipmaps=0
quality=slow
colorspace=linear,linear
rdo_lambda=0.0
filemasks=*_cm*,*_cubemap*

[SkyboxHDR]
pixelformat=BC6UH
pixelformat:es3=R9G9B9E5
discardalpha=1
powof2=1
mipmaps=1
quality=slow
colorspace=linear,linear
rdo_lambda=0.0

[SkyboxLDR]
pixelformat=BC7
pixelformat:es3=ETC2
discardalpha=1
powof2=1
mipmaps=1
quality=slow
colorspace=sRGB,auto
rdo_lambda=0.5

;;; ============================================================================
;;; Miscellaneous & UI
;;; ============================================================================

[CloudShadows]
pixelformat=BC4
pixelformat:es3=EAC_R11
powof2=1
mipmaps=0
colorspace=sRGB,linear
rdo_lambda=1.0

[ColorChart]
pixelformat=X8R8G8B8
colorchart=1
powof2=0
mipmaps=0
reduce=0
colorspace=linear,linear
filemasks=*_cch*

[Gradient]

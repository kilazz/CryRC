powof2=1
mipmaps=1
colorspace=sRGB,auto
rdo_lambda=1.5

[Opacity]
pixelformat=BC4
pixelformat:es3=EAC_R11
powof2=1
mipmaps=1
colorspace=linear,linear
rdo_lambda=1.0
filemasks=*_sss*,*_trans*,*_opac*

[Uncompressed]
pixelformat=X8R8G8B8
powof2=1
mipmaps=1
colorspace=sRGB,auto

[ReferenceImage]
